function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

const S={azerty:((navigator.language||'fr').toLowerCase().startsWith('fr')),padSwap:false,sound:true};

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,slide){if(!S.sound)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'square';const t=a.currentTime;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);}
function noise(d,vol){if(!S.sound)return;const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol||.1;s.connect(g);g.connect(a.destination);s.start();}
const SFX={
  move:()=>tone(520,.05,'square',.04),ok:()=>{tone(440,.07,'square',.06);setTimeout(()=>tone(660,.09,'square',.06),60)},back:()=>tone(300,.08,'square',.05),
  swing:()=>noise(.07,.05),jump:()=>tone(260,.12,'triangle',.06,260),
  hit:()=>{noise(.1,.16);tone(150,.12,'sawtooth',.09,-90)},heavy:()=>{noise(.16,.22);tone(95,.2,'sawtooth',.14,-60)},
  block:()=>{tone(700,.05,'square',.06);noise(.05,.06)},special:()=>{tone(180,.4,'sawtooth',.09,500);noise(.25,.08)},
  ko:()=>{tone(220,.7,'sawtooth',.12,-170);noise(.4,.2)},round:()=>{tone(330,.15,'square',.07);setTimeout(()=>tone(330,.15,'square',.07),180)},
  fight:()=>{tone(500,.12,'square',.08);setTimeout(()=>tone(750,.25,'square',.08),120)},heal:()=>tone(600,.3,'sine',.07,400)
};

/* ---------- entrées ---------- */
const keys={},kp={};let PR={};
addEventListener('keydown',e=>{
  if(e.code.startsWith('Arrow')||e.code==='Space'||e.code==='Backspace'||e.code==='Tab')e.preventDefault();
  if(!e.repeat)kp[e.code]=true;keys[e.code]=true;ac();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const mouse={x:-1,y:-1,moved:false,click:false};let hot=[];
function mpos(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;}
cv.addEventListener('mousemove',e=>{mpos(e);mouse.moved=true;});
cv.addEventListener('mousedown',e=>{mpos(e);mouse.click=true;cv.focus();ac();});
function mouseHit(){
  let r=null;const h=hot.find(h=>mouse.x>=h.x&&mouse.x<=h.x+h.w&&mouse.y>=h.y&&mouse.y<=h.y+h.h);
  if(h&&(mouse.moved||mouse.click))r={i:h.i,click:mouse.click};
  mouse.moved=false;mouse.click=false;return r;
}
const padPrev={};let PADS=[];
function pollPads(){
  PADS=[];const gps=navigator.getGamepads?Array.from(navigator.getGamepads()):[];
  for(const g of gps){
    if(!g||!g.connected)continue;
    const B=i=>!!(g.buttons[i]&&g.buttons[i].pressed),ax=g.axes||[];
    const cur={l:B(14)||ax[0]<-.5,r:B(15)||ax[0]>.5,u:B(12)||ax[1]<-.6,d:B(13)||ax[1]>.6,a:B(0),b:B(1),x:B(2),y:B(3),blk:B(4)||B(5)||B(6)||B(7),start:B(9)};
    const prev=padPrev[g.index]||{},press={};
    for(const k in cur)press[k]=cur[k]&&!prev[k];
    padPrev[g.index]=cur;PADS.push({cur,press});
  }
}
function padFor(p){const order=S.padSwap?[1,0]:[0,1];return PADS[order[p]];}
const KB=[
  {l:['KeyA'],r:['KeyD'],u:['KeyW'],d:['KeyS'],light:['KeyF'],heavy:['KeyG'],special:['KeyH']},
  {l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],light:['KeyK','Numpad1'],heavy:['KeyL','Numpad2'],special:['Semicolon','Numpad3']}
];
const held=a=>a.some(c=>keys[c]),pressed=a=>a.some(c=>PR[c]);
function readHuman(p,merge){
  const sets=merge?KB:[KB[p]],pad=padFor(p);
  const I={l:false,r:false,b:false,jump:false,light:false,heavy:false,special:false};
  for(const k of sets){
    I.l=I.l||held(k.l);I.r=I.r||held(k.r);I.b=I.b||held(k.d);
    I.jump=I.jump||pressed(k.u);I.light=I.light||pressed(k.light);I.heavy=I.heavy||pressed(k.heavy);I.special=I.special||pressed(k.special);
  }
  if(pad){
    I.l=I.l||pad.cur.l;I.r=I.r||pad.cur.r;I.b=I.b||pad.cur.blk||pad.cur.d;
    I.jump=I.jump||pad.press.a||pad.press.u;I.light=I.light||pad.press.x;I.heavy=I.heavy||pad.press.y;I.special=I.special||pad.press.b;
  }
  return I;
}
function computeNav(){
  const mk=()=>({l:false,r:false,u:false,d:false,ok:false,back:false,start:false});
  const N={p1:mk(),p2:mk(),any:mk()};
  const m1={l:['KeyA'],r:['KeyD'],u:['KeyW'],d:['KeyS'],ok:['KeyF','Enter','Space','NumpadEnter'],back:['KeyG','Escape','Backspace']};
  const m2={l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],ok:['KeyK','Numpad1'],back:['KeyL','Numpad2']};
  for(const k in m1){N.p1[k]=pressed(m1[k]);N.p2[k]=pressed(m2[k]);}
  for(let p=0;p<2;p++){
    const pad=padFor(p);if(!pad)continue;const n=p?N.p2:N.p1;
    n.l=n.l||pad.press.l;n.r=n.r||pad.press.r;n.u=n.u||pad.press.u;n.d=n.d||pad.press.d;n.ok=n.ok||pad.press.a;n.back=n.back||pad.press.b;
  }
  for(const k of ['l','r','u','d','ok','back'])N.any[k]=N.p1[k]||N.p2[k];
  for(const pad of PADS){const n=N.any;n.l=n.l||pad.press.l;n.r=n.r||pad.press.r;n.u=n.u||pad.press.u;n.d=n.d||pad.press.d;n.ok=n.ok||pad.press.a;n.back=n.back||pad.press.b;n.start=n.start||pad.press.start;}
  N.any.start=N.any.start||PR.Escape||PR.KeyP;
  return N;
}
const AZ={KeyA:'Q',KeyQ:'A',KeyW:'Z',KeyZ:'W',Semicolon:'M',KeyM:','};
function kl(code){
  const names={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',Numpad1:'Pavé 1',Numpad2:'Pavé 2',Numpad3:'Pavé 3',Enter:'Entrée',Space:'Espace',Escape:'Échap'};
  if(names[code])return names[code];
  if(S.azerty&&AZ[code])return AZ[code];
  if(code==='Semicolon')return ';';
  return code.replace('Key','').replace('Digit','');
}

function txt(s,x,y,size,col,al,o){

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function limb(x,y,l1,l2,a1,a2){const mx=x+Math.sin(a1)*l1,my=y+Math.cos(a1)*l1,b=a1+a2;return[mx,my,mx+Math.sin(b)*l2,my+Math.cos(b)*l2];}
function line2(c,x1,y1,x2,y2,w,col){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function bullseye(c,x,y,r,a,b){c.fillStyle=a||'#d1202e';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle=b||'#fff';c.beginPath();c.arc(x,y,r*.66,0,7);c.fill();c.fillStyle=a||'#d1202e';c.beginPath();c.arc(x,y,r*.33,0,7);c.fill();}
function rig(L1,L2,T,P){
  const ext=a=>Math.cos(a[0])*L1+Math.cos(a[0]+a[1])*L2;
  const hy=-Math.max(ext(P.lf),ext(P.lb))+P.bob+P.drop;
  return{hip:{x:0,y:hy},sh:{x:Math.sin(P.lean)*T,y:hy-Math.cos(P.lean)*T},dir:{x:Math.sin(P.lean),y:-Math.cos(P.lean)},perp:{x:Math.cos(P.lean),y:Math.sin(P.lean)}};
}

/* ---------- poses ---------- */
function poseOf(f){
  const t=f.anim,st=f.state;
  const P={lean:0,bob:Math.sin(t*.1)*1.6,drop:0,lf:[.25,-.22],lb:[-.22,.2],af:[1.0,-1.0],ab:[.55,-.9],wa:1.0,wx:0,rot:0,ph:0,k:0,anim:null};
  if(st==='walk'){
    const dn=(f.vx*f.face<0)?-1:1,s=Math.sin(f.wt*.3)*.7*dn;
    P.lf=[s,s<0?s*1.1:-.1];P.lb=[-s,-s<0?-s*1.1:-.1];P.bob=-Math.abs(Math.sin(f.wt*.3))*3;P.lean=.06*dn;
    P.af=[.9+s*.3,-.9];P.ab=[.5-s*.3,-.9];
  }else if(st==='jump'){
    const up=f.vy>0;
    P.lf=up?[.8,-1.3]:[.5,-.6];P.lb=up?[.1,-1.0]:[-.3,-.3];P.af=[1.4,-.5];P.ab=[.4,-1.1];P.lean=.05;P.bob=0;
  }else if(st==='hit'){
    P.lean=f.launched?-.6:-.28;P.af=[.1,-.5];P.ab=[-.7,-.3];P.lf=f.launched?[.7,-.4]:[.4,-.3];P.lb=f.launched?[-.6,.1]:[-.4,.1];P.bob=0;
  }else if(st==='block'){
    P.lean=-.05;P.drop=8;P.af=[1.9,-2.0];P.ab=[1.7,-1.9];P.lf=[.5,-.7];P.lb=[-.4,.3];P.bob=0;
  }else if(st==='down'||st==='ko'){
    P.rot=-Math.PI/2*clamp(f.t/7,0,1);P.lf=[.1,-.05];P.lb=[-.1,0];P.af=[.7,-.3];P.ab=[1.0,-.2];P.bob=0;
  }else if(st==='getup'){
    P.rot=-Math.PI/2*(1-clamp(f.t/14,0,1));P.lf=[.1,-.05];P.lb=[-.1,0];P.af=[.7,-.3];P.ab=[1.0,-.2];P.bob=0;
  }else if(st==='win'){
    P.af=[2.9,-.2];P.ab=[.5,-.5];P.bob=Math.sin(t*.15)*3;
  }else if(st==='atk'&&f.atk){
    const m=f.atk,t2=f.atkT;let ph;
    if(t2<=m.su)ph=-t2/m.su;else if(t2<=m.su+m.ac)ph=-1+2*(t2-m.su)/m.ac;else ph=1-(t2-m.su-m.ac)/Math.max(1,m.re);
    ph=clamp(ph,-1,1);const k=(ph+1)/2,ln=(a,b)=>lerp(a,b,k);P.ph=ph;P.k=k;P.anim=m.anim;P.bob=0;
    switch(m.anim){
      case'thrust':P.lean=ln(-.08,.14);P.af=[ln(1.2,1.5),ln(-1.9,-.05)];P.ab=[ln(.8,1.3),ln(-1.5,-.3)];P.wa=1.5;P.wx=ln(-10,20);P.lf=[.55,-.35];P.lb=[-.4,.2];break;
      case'slash':{const a=ln(-2.7,1.55);P.lean=ln(-.28,.3);P.af=[a,ln(.2,-.15)];P.ab=[a-.25,-.2];P.wa=a+.2;P.lf=[.6,-.4];P.lb=[-.5,.15];break;}
      case'cast':P.lean=ln(-.22,.12);P.af=[ln(.4,1.55),ln(-1.5,0)];P.ab=[ln(.2,1.4),ln(-1.6,-.1)];P.lf=[.5,-.3];P.lb=[-.4,.2];break;
      case'dash':{const s=Math.sin(t2*.7)*.9;P.lean=.5;P.af=[1.55,-.1];P.ab=[1.35,-.3];P.wa=1.55;P.wx=10;P.lf=[s,s<0?s:-.2];P.lb=[-s,-s<0?-s:-.2];break;}
      case'spin':P.lean=0;P.af=[1.57,0];P.ab=[1.57,0];P.wa=1.57;P.lf=[.3,-.3];P.lb=[-.3,.2];break;
      case'air':P.lean=ln(0,.2);P.af=[ln(1.0,1.5),ln(-1.5,0)];P.ab=[.8,-.9];P.wa=ln(.8,1.45);P.lf=[.9,-1.2];P.lb=[.2,-1.0];break;
    }
  }
  return P;
}

const hitboxOf=(f,m)=>{const[x0,x1,y0,y1]=m.hit,a=f.x+f.face*x0,b=f.x+f.face*x1;return{l:Math.min(a,b),r:Math.max(a,b),b:f.y+y0,t:f.y+y1};};

function spawnProj(f,m){

function updAtk(f,inp,o){
  const m=f.atk;f.atkT++;const t=f.atkT,a0=m.su,a1=m.su+m.ac,air=f.y>0||f.vy>0;

  }

    if(want(f,'heavy')&&m.rank<2){use(f,'heavy');startAttack(f,'heavy');return;}

function updFree(f,inp,o){
  const air=f.y>0||f.vy>0;
  if(f.lag>0){f.lag--;f.vx*=.7;if(!air)f.state='idle';return;}
  if(f.bs>0){f.bs--;f.state='block';f.vx*=.8;return;}
  if(!air){
    if(want(f,'special')&&f.meter>=50){use(f,'special');doSpecial(f);return;}
    if(want(f,'heavy')){use(f,'heavy');startAttack(f,'heavy');return;}
    if(want(f,'light')){use(f,'light');startAttack(f,'light');return;}
    f.face=o.x>=f.x?1:-1;
    if(inp.b){if(f.state!=='block')setState(f,'block');f.vx=0;return;}
    if(want(f,'jump')){use(f,'jump');f.vy=f.c.jump;f.vx=((inp.r?1:0)-(inp.l?1:0))*f.c.spd*1.05;setState(f,'jump');SFX.jump();return;}

  }
}
function stepFighter(f,inp,o){
  f.anim++;if(f.invul>0)f.invul--;if(f.comboT>0){f.comboT--;if(f.comboT===0)f.combo=0;}
  for(const k of BUFK){if(inp[k])f.buf[k]=7;else if(f.buf[k]>0)f.buf[k]--;}
  const free=f.state==='idle'||f.state==='walk'||f.state==='block'||f.state==='jump';
  if(free){f.comboN=0;updFree(f,inp,o);}
  else if(f.state==='atk')updAtk(f,inp,o);
  else if(f.state==='hit'){f.stun--;if(f.y<=0&&f.vy<=0)f.vx*=.85;if(!f.launched&&f.stun<=0)setState(f,'idle');}
  else if(f.state==='down'){f.vx*=.85;if(f.t>=38){setState(f,'getup');f.invul=24;}}
  else if(f.state==='getup'){if(f.t>=14)setState(f,'idle');}
  else if(f.state==='ko'){if(f.y<=0)f.vx*=.85;}
  else if(f.state==='win'){f.vx=0;}
  f.t++;
  // physique
  f.x+=f.vx;let landed=false;
  if(f.y>0||f.vy>0){f.vy-=GRAV;f.y+=f.vy;if(f.y<=0){f.y=0;f.vy=0;landed=true;}}
  f.x=clamp(f.x,50,W-50);

    const lo=f.face===1?175:50,hi=f.face===1?W-50:W-175,tg=clamp(f.x,lo,hi);f.x+=clamp(tg-f.x,-14,14);
  }

    else if(f.state==='atk'&&f.atkKey==='air'){f.lag=6;setState(f,'idle');f.vx=0;}
    else if(f.state==='hit'&&f.launched){f.launched=false;setState(f,'down');f.vx*=.3;noise(.08,.1);}
    else if(f.state==='ko'){f.vx*=.3;noise(.1,.14);}

}
function pushApart(a,b){
  if(Math.abs(a.y-b.y)>90)return;
  const min=(a.c.w+b.c.w)*.5*.85,dx=b.x-a.x,ad=Math.abs(dx);

}

const DIFFS=[
 {name:'Facile',desc:'Réactions lentes, attaque peu, bloque rarement.',think:24,block:.10,aggr:.30,spec:.20,combo:.10,punish:.05,jump:.05,read:0},
 {name:'Normal',desc:'Équilibrée : bloque, enchaîne et lance des spéciaux.',think:14,block:.40,aggr:.45,spec:.40,combo:.40,punish:.30,jump:.10,read:.2},
 {name:'Difficile',desc:'Agressive. Punit tes coups ratés et lit tes attaques.',think:8,block:.65,aggr:.60,spec:.60,combo:.70,punish:.60,jump:.12,read:.5},
 {name:'Cauchemar',desc:'Impitoyable. Presque aucune ouverture.',think:3,block:.88,aggr:.75,spec:.80,combo:.95,punish:.90,jump:.15,read:.85}
];
const newAI=()=>({cd:30,hold:null,ht:0,seq:-1,chain:-1});
function aiInput(f,o,ai){
  const D=DIFFS[cfg.diff],I={l:false,r:false,b:false,jump:false,light:false,heavy:false,special:false};
  if(f.state==='hit'||f.state==='ko'||f.state==='down'||f.state==='getup'||f.state==='win'){ai.hold=null;ai.ht=0;ai.cd=Math.min(ai.cd,D.think);return I;}
  ai.cd--;
  const d=Math.abs(o.x-f.x),toward=o.x>f.x?'r':'l',away=toward==='r'?'l':'r',grounded=f.y<=0;
  const mv=f.c.moves,lr=mv.light.hit[1],hr=mv.heavy.hit[1];
  const oAtk=o.state==='atk'&&o.atk;
  const reach=oAtk&&o.atk.hit?Math.max(Math.abs(o.atk.hit[0]),Math.abs(o.atk.hit[1]))+35:0;
  const proj=G.projs.find(p=>p.owner!==f&&Math.abs(p.x-f.x)<280&&(p.vx>0)===(f.x>p.x));
  // réaction immédiate (niveaux élevés)
  if(D.read>0&&oAtk&&ai.seq!==o.atkSeq&&o.atkT<=o.atk.su&&d<reach&&grounded){
    ai.seq=o.atkSeq;if(Math.random()<D.block*D.read+.1){ai.hold='block';ai.ht=rint(14,26);}
  }
  // enchaînement
  if(f.state==='atk'&&f.connected&&ai.chain!==f.atkSeq&&f.atkT>f.atk.su){
    ai.chain=f.atkSeq;
    if(Math.random()<D.combo){
      if(f.atk.rank===1){if(f.meter>=50&&Math.random()<.5)I.special=true;else I.heavy=true;}
      else if(f.atk.rank===2&&f.meter>=50)I.special=true;
    }
  }
  const free=f.state==='idle'||f.state==='walk'||f.state==='block';
  if(ai.cd<=0&&free){
    const canSp=f.meter>=50&&d>=f.c.spR[0]&&d<=f.c.spR[1];
    const threat=(oAtk&&d<reach)||!!proj;
    if(threat&&grounded&&Math.random()<D.block){ai.hold='block';ai.ht=rint(12,26);}
    else if(proj&&grounded&&Math.random()<D.jump*3){I.jump=true;ai.hold='fwd';ai.ht=18;}
    else if(canSp&&Math.random()<D.spec*.5)I.special=true;
    else if(d>hr+25){
      if(Math.random()<D.jump){I.jump=true;ai.hold='fwd';ai.ht=25;}
      else{ai.hold='fwd';ai.ht=rint(8,22);}
    }else{
      const recov=oAtk&&o.atkT>o.atk.su+o.atk.ac;
      if(recov&&Math.random()<D.punish){if(d>lr)I.heavy=true;else Math.random()<.5?I.heavy=true:I.light=true;}
      else if(o.y>40&&d<lr+40&&Math.random()<D.aggr)I.light=true;
      else if(Math.random()<D.aggr){if(d>lr)I.heavy=true;else Math.random()<.65?I.light=true:I.heavy=true;}
      else{const r=Math.random();if(r<.4){ai.hold='back';ai.ht=rint(8,16);}else if(r<.7){ai.hold='block';ai.ht=rint(10,18);}else{ai.hold='fwd';ai.ht=6;}}
    }
    ai.cd=D.think+rint(0,D.think);
  }
  if(ai.ht>0){ai.ht--;
    if(ai.hold==='fwd')I[toward]=true;else if(ai.hold==='back')I[away]=true;else if(ai.hold==='block')I.b=true;
  }
  return I;
}

const cfg={mode:'camp',diff:1,pick:[0,1],map:0,stage:0};
const SAVE={prog:0};
try{SAVE.prog=clamp(parseInt(localStorage.getItem('duel3.prog'),10)||0,0,16);}catch(e){}
function saveProg(){try{localStorage.setItem('duel3.prog',String(SAVE.prog));}catch(e){}}
const CAMP=[3,2,4,1],CAMP_MAP=[1,2,3,0],LEVELS=['Facile','Normal','Difficile','Cauchemar'],NEED=[1,1,2,2];
function unlocked(ci){if(ci===0)return true;const ch=CAMP.indexOf(ci);return ch>=0&&SAVE.prog>=4*(ch+1);}
const M={title:{sel:0},camp:{sel:0},diff:{sel:1},map:{sel:0},res:{sel:0},ctrl:{page:0,sel:0,ret:'title'},pause:{sel:0}};
let SEL=null;
const NOIN={l:false,r:false,b:false,jump:false,light:false,heavy:false,special:false};
function menuNav(m,n,N,mi){
  if(N.any.u){m.sel=(m.sel+n-1)%n;SFX.move();}
  if(N.any.d){m.sel=(m.sel+1)%n;SFX.move();}
  if(mi&&mi.i>=0&&mi.i<n){if(m.sel!==mi.i&&!mi.click)SFX.move();m.sel=mi.i;if(mi.click)return true;}
  return N.any.ok;
}
function go(s){scene=s;hot=[];}
function enterSelect(){SEL={cur:[0,0],lock:[false,false],pick:[0,0],step:0,delay:0};go('select');}
function newRound(){
  G.f=[mkFighter(cfg.pick[0],0),mkFighter(cfg.pick[1],1)];G.projs=[];parts=[];
  G.timer=60*60;G.phase=G.mode==='training'?'fight':'intro';G.pt=0;G.hitstop=0;G.shake=0;G.flash=0;G.ai=[newAI(),newAI()];G.idle=0;G.winner=-1;G.timeup=false;
}
function startMatch(){
  G={mode:cfg.mode,need:cfg.mode==='camp'?NEED[cfg.stage%4]:2,won:false,newUnlock:-1,done:false,f:null,projs:[],round:1,wins:[0,0],paused:false,over:false,flash:0,flashCol:'#fff',shake:0,hitstop:0};
  newRound();go('fight');
}

function update(){
  PR={};for(const k in kp){PR[k]=true;delete kp[k];}
  pollPads();const N=computeNav();tcount++;
  const mi=mouseHit();
  const hint=document.getElementById('hint');
  if(PADS.length&&hint.dataset.pad!=='1'){hint.dataset.pad='1';}
  switch(scene){
    case'title':updTitle(N,mi);break;case'diff':updDiff(N,mi);break;case'camp':updCamp(N,mi);break;case'select':updSelect(N,mi);break;
    case'map':updMap(N,mi);break;case'fight':updFight(N,mi);break;case'result':updResult(N,mi);break;case'ctrl':updCtrl(N,mi);break;
  }
}
const TITLE_ITEMS=['Campagne','Versus local · 2 joueurs','Entraînement','Commandes & réglages'];
function updTitle(N,mi){
  if(menuNav(M.title,4,N,mi)){SFX.ok();const s=M.title.sel;
    if(s===0){enterCamp();}
    else if(s===1){cfg.mode='versus';enterSelect();}
    else if(s===2){cfg.mode='training';enterSelect();}
    else{M.ctrl.ret='title';M.ctrl.page=0;go('ctrl');}}
}
function updDiff(N,mi){
  if(menuNav(M.diff,4,N,mi)){SFX.ok();cfg.diff=M.diff.sel;enterSelect();}
  if(N.any.back){SFX.back();go('title');}
}
function updSelect(N,mi){
  const versus=cfg.mode==='versus',camp=cfg.mode==='camp';
  const clickI=mi&&mi.i>=0&&mi.i<NC?mi:null;
  const pool=()=>{const a=[];for(let i=0;i<CHARS.length;i++)if(unlocked(i))a.push(i);return a;};
  const finish=p=>{
    const c=SEL.cur[p];if(c<CHARS.length&&!unlocked(c)){SFX.back();return false;}
    SEL.lock[p]=true;if(c===NC-1){const a=pool();SEL.pick[p]=a[rint(0,a.length-1)];}else SEL.pick[p]=c;SFX.ok();return true;
  };
  if(!versus){
    const p=SEL.step,n=N.any;
    if(n.l){SEL.cur[p]=(SEL.cur[p]+NC-1)%NC;SFX.move();}
    if(n.r){SEL.cur[p]=(SEL.cur[p]+1)%NC;SFX.move();}
    let ok=n.ok;if(clickI){if(SEL.cur[p]!==clickI.i&&!clickI.click)SFX.move();SEL.cur[p]=clickI.i;if(clickI.click)ok=true;}
    if(ok){if(finish(p)){SEL.step++;
      if(camp){campStart(cfg.stage,SEL.pick[0]);return;}
      if(SEL.step>=2){cfg.pick=[SEL.pick[0],SEL.pick[1]];go('map');M.map.sel=0;}}}
    else if(n.back){SFX.back();if(SEL.step===0)go(camp?'camp':'title');else{SEL.step--;SEL.lock[SEL.step]=false;}}
  }else{
    for(let p=0;p<2;p++){
      const n=p?N.p2:N.p1;
      if(SEL.lock[p]){if(n.back){SEL.lock[p]=false;SFX.back();}continue;}
      if(n.l){SEL.cur[p]=(SEL.cur[p]+NC-1)%NC;SFX.move();}
      if(n.r){SEL.cur[p]=(SEL.cur[p]+1)%NC;SFX.move();}
      let ok=n.ok;if(p===0&&clickI){SEL.cur[0]=clickI.i;if(clickI.click)ok=true;}
      if(ok)finish(p);
      else if(n.back&&!SEL.lock[1-p]){SFX.back();go('title');return;}
    }
    if(SEL.lock[0]&&SEL.lock[1]){SEL.delay++;if(SEL.delay>25){cfg.pick=[SEL.pick[0],SEL.pick[1]];go('map');M.map.sel=0;}}else SEL.delay=0;
  }
}
/* ---------- campagne ---------- */
function enterCamp(){cfg.mode='camp';M.camp.sel=Math.min(SAVE.prog,15);go('camp');}
function campStart(st,pl){const ch=Math.floor(st/4);cfg.mode='camp';cfg.stage=st;cfg.diff=st%4;cfg.pick=[pl,CAMP[ch]];cfg.map=CAMP_MAP[ch];startMatch();}
function finishCamp(){
  if(G.mode!=='camp')return;
  G.won=G.wins[0]>=G.need&&G.wins[0]>G.wins[1];
  if(G.won&&cfg.stage===SAVE.prog){SAVE.prog++;saveProg();if(SAVE.prog%4===0)G.newUnlock=CAMP[SAVE.prog/4-1];if(SAVE.prog>=16)G.done=true;}
}
function updCamp(N,mi){
  const c=M.camp,reach=Math.min(SAVE.prog,15);
  let ch=Math.floor(c.sel/4),lv=c.sel%4,moved=false;
  if(N.any.l&&ch>0){ch--;moved=true;}if(N.any.r&&ch<3){ch++;moved=true;}
  if(N.any.u&&lv>0){lv--;moved=true;}if(N.any.d&&lv<3){lv++;moved=true;}
  if(moved){SFX.move();c.sel=Math.min(ch*4+lv,reach);}
  let ok=N.any.ok;
  if(mi&&mi.i>=0&&mi.i<=reach){if(c.sel!==mi.i&&!mi.click)SFX.move();c.sel=mi.i;if(mi.click)ok=true;}
  if(ok){SFX.ok();cfg.stage=c.sel;cfg.mode='camp';enterSelect();}
  else if(N.any.back){SFX.back();go('title');}
}
function updMap(N,mi){
  const m=M.map;
  if(N.any.l){m.sel=(m.sel+4)%5;SFX.move();}if(N.any.r){m.sel=(m.sel+1)%5;SFX.move();}
  let ok=N.any.ok;if(mi&&mi.i>=0&&mi.i<5){m.sel=mi.i;if(mi.click)ok=true;}
  if(ok){SFX.ok();cfg.map=m.sel===4?rint(0,3):m.sel;startMatch();}
  else if(N.any.back){SFX.back();enterSelect();}
}
const RES_ITEMS=['Revanche','Changer de combattants','Menu principal'];
function resItems(){
  if(G.mode==='camp'){
    if(G.won)return cfg.stage<15?['Combat suivant','Carte de la campagne','Menu principal']:['Carte de la campagne','Menu principal'];
    return['Réessayer','Carte de la campagne','Menu principal'];
  }
  return RES_ITEMS;
}
function updResult(N,mi){
  for(const f of G.f)f.anim++;updParts();
  const items=resItems();
  if(menuNav(M.res,items.length,N,mi)){SFX.ok();const s=items[M.res.sel];
    if(s==='Revanche')startMatch();else if(s==='Changer de combattants')enterSelect();else if(s==='Menu principal')go('title');
    else if(s==='Combat suivant')campStart(cfg.stage+1,cfg.pick[0]);else if(s==='Réessayer')campStart(cfg.stage,cfg.pick[0]);else enterCamp();}
}
const PAUSE_ITEMS=['Reprendre','Commandes','Quitter vers le menu'];
function updFight(N,mi){
  if(G.paused){
    if(menuNav(M.pause,3,N,mi)){SFX.ok();const s=M.pause.sel;if(s===0)G.paused=false;else if(s===1){M.ctrl.ret='fight';M.ctrl.page=0;go('ctrl');}else{G.paused=false;go('title');}}
    if(N.any.start||N.any.back){G.paused=false;}
    return;
  }
  if(N.any.start&&(G.phase==='intro'||G.phase==='fight')){G.paused=true;M.pause.sel=0;SFX.ok();return;}
  if(G.flash>0)G.flash=Math.max(0,G.flash-.035);G.shake*=.85;if(G.shake<.2)G.shake=0;
  if(G.hitstop>0){G.hitstop--;return;}
  const[a,b]=G.f;G.pt++;
  for(const f of G.f){f.trail=f.trail>f.hp?Math.max(f.hp,f.trail-1.4):f.hp;}
  if(G.phase==='intro'){
    if(G.pt===1)SFX.round();if(G.pt===78)SFX.fight();
    a.anim++;b.anim++;if(G.pt>=122){G.phase='fight';G.pt=0;}
  }else if(G.phase==='fight'){
    const merge=G.mode!=='versus';
    const ia=readHuman(0,merge);
    const ib=G.mode==='versus'?readHuman(1,false):(G.mode==='training'?NOIN:aiInput(b,a,G.ai[1]));
    stepFighter(a,ia,b);stepFighter(b,ib,a);pushApart(a,b);updProjs();
    for(const f of G.f)if(f.state==='ko')f.state='ko';
    if(G.mode==='training'){
      G.idle++;if(G.idle>150&&b.state==='idle'){a.hp=a.max;b.hp=b.max;}
      for(const f of G.f)f.meter=Math.min(100,f.meter+.12);
    }else{
      G.timer--;
      if(a.state==='ko'||b.state==='ko'){
        G.winner=(a.state==='ko'&&b.state==='ko')?-1:(a.state==='ko'?1:0);G.phase='ko';G.pt=0;SFX.ko();G.flash=.9;G.flashCol='#fff';G.shake=12;
      }else if(G.timer<=0){
        const ra=a.hp/a.max,rb=b.hp/b.max;G.winner=Math.abs(ra-rb)<.001?-1:(ra>rb?0:1);G.phase='ko';G.pt=0;G.timeup=true;
      }
    }
  }else if(G.phase==='ko'){
    const slow=G.pt<70&&!G.timeup;
    if(!slow||G.pt%2===0){stepFighter(a,NOIN,b);stepFighter(b,NOIN,a);updProjs();}
    if(G.pt>=110){
      G.phase='end';G.pt=0;
      if(G.winner>=0){G.wins[G.winner]++;const w=G.f[G.winner];if(w.state!=='ko'){w.state='win';w.t=0;w.vx=0;}}
      else{G.wins[0]++;G.wins[1]++;}
    }
  }else if(G.phase==='end'){
    for(const f of G.f){f.anim++;if(f.state!=='ko'&&f.state!=='win'){stepFighter(f,NOIN,f===a?b:a);}}
    if(G.pt>=120){
      if(G.wins[0]>=G.need||G.wins[1]>=G.need){G.over=true;finishCamp();go('result');M.res.sel=0;}
      else{G.round++;newRound();}
    }
  }
  updParts();
}
function updCtrl(N,mi){
  const c=M.ctrl;
  if(N.any.back||N.any.start){SFX.back();if(c.ret==='fight'){scene='fight';}else go('title');return;}
  if(N.any.l){c.page=(c.page+2)%3;SFX.move();}if(N.any.r){c.page=(c.page+1)%3;SFX.move();}
  if(mi&&mi.click&&mi.i>=10&&mi.i<=12){c.page=mi.i-10;SFX.move();}
  if(c.page===2){
    if(N.any.u){c.sel=(c.sel+3)%4;c.armed=false;SFX.move();}if(N.any.d){c.sel=(c.sel+1)%4;c.armed=false;SFX.move();}
    let ok=N.any.ok;if(mi&&mi.i>=0&&mi.i<4){c.sel=mi.i;if(mi.click)ok=true;}
    if(ok){SFX.ok();if(c.sel===0)S.azerty=!S.azerty;else if(c.sel===1)S.padSwap=!S.padSwap;else if(c.sel===2)S.sound=!S.sound;else{if(c.armed){SAVE.prog=0;saveProg();c.armed=false;}else c.armed=true;}}
  }
}

function drawFighter(f){
